on:
  push:
    branches: [ production ]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: self-hosted
    
    outputs:
      backend_image_tag: 'localhost:32000/snowflake-back:latest'
      frontend_image_tag: 'localhost:32000/snowflake-front:latest'

    steps:
      - name: Download code (checkout)
        uses: actions/checkout@v4

      - name: Set image tags
        id: set-tags
        run: |
          echo "BACKEND_TAG=localhost:32000/snowflake-back:latest" >> $GITHUB_OUTPUT
          echo "FRONTEND_TAG=localhost:32000/snowflake-front:latest" >> $GITHUB_OUTPUT

      - name: Building backend image
        run: docker build -t ${{ steps.set-tags.outputs.BACKEND_TAG }} ./backend

      - name: Building frontend image
        run: docker build -t ${{ steps.set-tags.outputs.FRONTEND_TAG }} ./frontend

      - name: Save Docker images to one file
        run: |
          docker save -o images.tar \
            ${{ steps.set-tags.outputs.BACKEND_TAG }} \
            ${{ steps.set-tags.outputs.FRONTEND_TAG }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-multi
          path: images.tar

  SAST:
    runs-on: self-hosted

    needs: [build]

    steps:
      - name: Download code (checkout)
        uses: actions/checkout@v4

      - name: Run semgrep (frontend code scan)
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          working-directory: ./frontend
          config: |
            p/react
            p/javascript

      - name: Run semgrep (backend code scan)
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          working-directory: ./backend
          config: |
            p/python
            p/flask

      - name: Upload SAST artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep-reports
          path: |
            semgrep-frontend.json
            semgrep-backend.json

  SCA_and_Image-Trivy:
    runs-on: self-hosted
    needs: [build]

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images-multi

      - name: Load Docker images
        run: docker load -i images.tar

      - name: Run Trivy on Backend image
        uses: aquasecurity/trivy-action@0.20.0
        continue-on-error: true
        with:
          image-ref: ${{ needs.build.outputs.backend_image_tag }}
          scan-type: 'image'
          format: 'json'
          output: 'trivy-backend.json'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Run Trivy on Frontend image
        uses: aquasecurity/trivy-action@0.20.0
        continue-on-error: true
        with:
          image-ref: ${{ needs.build.outputs.frontend_image_tag }}
          scan-type: 'image'
          format: 'json'
          output: 'trivy-frontend.json'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Download code (checkout)
        uses: actions/checkout@v4

      - name: SCA scan using trivy
        uses: aquasecurity/trivy-action@0.20.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'trivy-fs.json'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,secret,misconfig'
          exit-code: '1'
          ignore-unfixed: true
          scan-ref: '.'

      - name: Upload SCA & image scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sca-trivy-reports
          path: |
            trivy-backend.json
            trivy-frontend.json
            trivy-fs.json

  DAST:
    runs-on: self-hosted
    needs: [build]

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images-multi

      - name: Load Docker images
        run: docker load -i images.tar

      # - name: Start database service
      #   run: |
      #     docker run -d -p 27017:27017 --name snowflake-db mongo:latest  
      #     sleep 10

      # - name: Start backend service
      #   run: |
      #     docker run -d -p 5000:5000 --name snowflake-back ${{ needs.build.outputs.backend_image_tag }}

      - name: Start frontend service
        run: |
          docker rm -f snowflake-front 2>/dev/null || true
          docker run -d -p 5173:5173 --name snowflake-front ${{ needs.build.outputs.frontend_image_tag }}

      - name: Run OWASP ZAP Baseline Scan Frontend
        id: zap_baseline
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: 'http://localhost:5173'
          #rules_file_name: '.zap/rules.tsv'

      - name: Collect ZAP outputs
        continue-on-error: true
        run: |
          mkdir -p zap-artifacts
          # copy common possible output names produced by ZAP baseline action
          [ -f zap-frontend.json ] && cp zap-frontend.json zap-artifacts/ || true
          [ -f zap-report.json ] && cp zap-report.json zap-artifacts/ || true
          [ -f zap_report.json ] && cp zap_report.json zap-artifacts/ || true
          [ -f baseline-report.json ] && cp baseline-report.json zap-artifacts/ || true
          [ -f zap-report.html ] && cp zap-report.html zap-artifacts/ || true
          [ -d .zap ] && cp -r .zap zap-artifacts/ || true
          ls -la zap-artifacts || true

      # - name: Run OWASP ZAP Baseline Scan Backend
      #   uses: zaproxy/action-baseline@v0.15.0
      #   with:
      #     target: 'http://localhost:5000/api'
      #   continue-on-error: true

      - name: Stop frontend service
        run: docker stop snowflake-front && docker rm snowflake-front

      # - name: Stop backend service
      #   run: docker stop snowflake-back && docker rm snowflake-back  

      # - name: Stop database service
      #   run: docker stop snowflake-db && docker rm snowflake-db

      - name: Upload DAST artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-reports
          path: zap-artifacts

  push:
    runs-on: self-hosted
    needs: [build, SCA_and_Image-Trivy, SAST, DAST]
    #needs: [build, DAST]

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images-multi

      - name: Load Docker images
        run: docker load -i images.tar
        
      - name: Push Docker images
        run: |
          docker push ${{ needs.build.outputs.backend_image_tag }}
          
          docker push ${{ needs.build.outputs.frontend_image_tag }}

  deploy:
    runs-on: self-hosted
    needs: [push]
    env:
      BACKEND_DEPLOYMENT: deployment/snowflake-back
      FRONTEND_DEPLOYMENT: deployment/snowflake-front

    steps:
      - name: Restart front deployment
        run: microk8s kubectl rollout restart ${{ env.FRONTEND_DEPLOYMENT }}

      - name: Restart back deployment
        run: microk8s kubectl rollout restart ${{ env.BACKEND_DEPLOYMENT }}